# FoodCal AI — Free-tier deployment attempt
services:
  # FastAPI backend
  - type: web
    name: foodcal-ai-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /
    envVars:
      - key: FOODCAL_CORS_ORIGINS
        sync: false
      - key: OMP_NUM_THREADS
        value: "1"

  # React frontend
  - type: web
    name: foodcal-ai
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: NODE_VERSION
        value: "24"